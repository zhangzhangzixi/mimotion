name: Adjust Walking Cron

on:
  workflow_run:
    workflows: ["walking"]
    types:
      - completed
  workflow_dispatch:

jobs:
  adjust:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README

      - name: adjust walking cron
        run: |
          source adjust_walking_cron.sh
          adjust_walking_cron ${{ github.event_name }}
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          current=`TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S'`
          git commit -m "[${current}] adjust walking cron trigger by ${{ github.event_name }}" || echo "No changes to commit"
          git push origin master
